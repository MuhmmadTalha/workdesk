# Supabase pauses free-tier projects after 7 days without database activity.
# This runs a tiny read query every 5 days so the project stays awake.
# Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (the public anon key, NOT the service-role key).
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 */5 * *" # every 5 days at 06:00 UTC (days 1, 6, 11, 16, 21, 26, 31)
  workflow_dispatch: # manual "Run workflow" button for testing

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # Calls public.keep_alive() (supabase/004-keep-alive.sql): a real Postgres query
          # that returns the server time and touches no table data.
          curl -fsS --retry 3 --retry-delay 10 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase pinged at $(date -u)"
